server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: question-service
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:saberpro}
    password: ${SPRING_RABBITMQ_PASSWORD:saberpro}
    connection-timeout: 5s

# Persistence adapter switch: jpa | memory  (decision A16 / interchangeability protocol)
question:
  repository:
    adapter: ${QUESTION_REPOSITORY_ADAPTER:jpa}

validation:
  service:
    url: ${VALIDATION_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: ${VALIDATION_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${VALIDATION_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    # Disabled by default so the local profile does not depend on a running broker.
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
