server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: lifecycle-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:saberpro}
    password: ${SPRING_RABBITMQ_PASSWORD:saberpro}
    connection-timeout: 5s
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 4000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
